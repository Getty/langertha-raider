name    = Langertha-Raider
author  = Torsten Raudssus <torsten@raudssus.de> L<https://raudssus.de/>
license = Perl_5
copyright_holder = Torsten Raudssus
copyright_year   = 2026
main_module = lib/Langertha/Raider.pm

; Getty release command:
;   dzil release
; run_after_release publishes the GitHub release (maint/release-after.pl; repo default there,
; gh binary via GH_BIN). That release is what fires .github/workflows/release-binaries.yml.
; The Docker Hub image is built and pushed by Dist::Zilla::Plugin::Docker::API, configured by
; docker_image and the [@Author::GETTY::Docker / runtime-root] subsection below. It talks to
; the container engine at DOCKER_HOST over the Engine HTTP API (no docker binary; rootless
; Podman works) and builds the image from the built dist in every build -- dzil build, dzil
; test and dzil release alike. The release then tags and pushes docker_tags: latest, <major>,
; <version>. Push credentials are read from ~/.docker/config.json (or $DOCKER_CONFIG) only.
;   DZIL_DOCKER_API_SKIP=1 dzil build    # or dzil test: no engine contact, no image
; dzil release refuses to run with that variable set.
; The published image is the Dockerfile stage runtime-root, not its last stage (runtime-user),
; and takes the release version as RAIDER_VERSION. The bundle's automatic Docker section
; passes neither, hence docker_default = 0 and the explicit subsection.
; RAIDER_DOCKER_BUILD_ARGS (extra docker build arguments from the environment, such as
; --platform) is gone: Docker::API build_arg templates expand dist variables only.

[@Author::GETTY]
irc = #langertha
irc_user = Getty
; Git::GatherDir ships every tracked file, so development infrastructure has to be
; excluded explicitly or it silently joins the CPAN tarball.
gather_exclude_match = ^\.claude/
gather_exclude_match = ^CLAUDE\.md$
gather_exclude_match = ^CONTEXT\.md$
gather_exclude_match = ^docs/
; the standalone-binary build (scripts/, run by .github/workflows/release-binaries.yml
; from the git tag) needs a checkout, not the CPAN tarball
gather_exclude_match = ^\.github/
gather_exclude_match = ^scripts/
run_after_release = %x %o/maint/release-after.pl --archive %a --version %v
docker_image = raudssus/raider
docker_tags = latest %V %v
docker_default = 0

[@Author::GETTY::Docker / runtime-root]
target = runtime-root
build_arg = RAIDER_VERSION=%v

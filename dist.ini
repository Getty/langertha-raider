name    = Langertha-Raider
author  = Torsten Raudssus <torsten@raudssus.de> L<https://raudssus.de/>
license = Perl_5
copyright_holder = Torsten Raudssus
copyright_year   = 2026
main_module = lib/Langertha/Raider.pm

; Getty release command:
;   dzil release
; Everything beyond the CPAN upload comes from [@Author::GETTY]; nothing is wired by hand.
; - docker_image adds Dist::Zilla::Plugin::Docker::API. It talks to the container engine at
;   DOCKER_HOST over the Engine HTTP API (no docker binary; rootless Podman works) and builds
;   the image from the built dist in every build -- dzil build, dzil test and dzil release
;   alike. The release then tags and pushes docker_tags: latest, <major>, <version>. Push
;   credentials are read from ~/.docker/config.json (or $DOCKER_CONFIG) only.
;     DZIL_DOCKER_API_SKIP=1 dzil build    # or dzil test: no engine contact, no image
;   dzil release refuses to run with that variable set.
; - GitHub::CreateRelease publishes the GitHub release once the tag is pushed: Changes
;   section as notes, CPAN tarball attached, token from ~/.github-identity. Never create the
;   release from run_after_release: that hook runs before the tag exists, so gh puts the tag
;   on the old remote head and Git::Push then fails on it. That release is what fires
;   .github/workflows/release-binaries.yml.
; No build arguments are passed: RAIDER_DOCKER_BUILD_ARGS is gone. The published image is
; the Dockerfile's last stage, runtime-root; keep it last, the bundle builds no other.

[@Author::GETTY]
irc = #langertha
irc_user = Getty
; Git::GatherDir ships every tracked file, so development infrastructure has to be
; excluded explicitly or it silently joins the CPAN tarball.
gather_exclude_match = ^\.claude/
gather_exclude_match = ^CLAUDE\.md$
gather_exclude_match = ^CONTEXT\.md$
gather_exclude_match = ^docs/
; the standalone-binary build (scripts/, run by .github/workflows/release-binaries.yml
; from the git tag) needs a checkout, not the CPAN tarball
gather_exclude_match = ^\.github/
gather_exclude_match = ^scripts/
; README and POD images are loaded from GitHub, they stay out of the CPAN tarball
gather_exclude_match = ^assets/
docker_image = raudssus/raider
docker_tags = latest %V %v

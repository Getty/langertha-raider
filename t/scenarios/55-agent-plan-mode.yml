title: in plan mode a subagent cannot write and its exit_plan_mode switches nothing; the caller stays in plan mode
permission_mode: plan
review: [ yes ]
prompt: Plan with an agent.
script:
  - tool_calls:
      - [ agent, { description: Plan, prompt: Plan the change. } ]
  - tool_calls:
      - [ write_file, { path: a.txt, content: x } ]
  - tool_calls:
      - [ exit_plan_mode, { plan: CHILD-PLAN } ]
  - text: CHILD-PLAN
  - tool_calls:
      - [ write_file, { path: b.txt, content: x } ]
  - text: still planning
expect:
  answer: still planning
  absent: [ a.txt, b.txt ]
  plans: []
  tools:
    - { name: write_file, error: true, text: 'plan mode: write_file changes files' }
    - { name: exit_plan_mode, text: '\ANobody can approve the plan in a subagent\. Stay in plan mode' }
    - { name: agent, text: '\ACHILD-PLAN\z' }
    - { name: write_file, error: true, text: 'plan mode: write_file changes files' }

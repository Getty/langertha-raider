title: edit_file with a text that is not in the file fails and leaves the file alone
files:
  app.txt: "one\ntwo\n"
prompt: Change three to 3.
script:
  - tool_calls:
      - [ edit_file, { path: app.txt, old_string: three, new_string: "3" } ]
  - text: gescheitert
expect:
  answer: gescheitert
  files:
    app.txt: "one\ntwo\n"
  tools:
    - { name: edit_file, error: true }

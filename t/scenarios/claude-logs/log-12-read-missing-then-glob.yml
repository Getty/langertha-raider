# Real pattern: Read of a path that does not exist (the model guessed the name),
# Glob for the real one, Read again; and Write over an existing file without a
# Read first.
# Abweichung: Claude Code answers "File does not exist. Note: your current
# working directory is ..." and refuses Write/Edit on a file not Read in the
# session ("File has not been read yet. Read it first before writing to it.");
# raider says "Error: not a file: <path>" for the missing file and overwrites
# the unread file without complaint.
title: read_file on a guessed name fails, glob finds the real one; write_file overwrites an unread file
files:
  docs/setup-guide.md: "Setup: run make.\n"
  out.txt: "old content\n"
prompt: Summarise the setup doc, then write the summary to out.txt.
script:
  - tool_calls:
      - [ read_file, { path: docs/setup.md } ]
  - tool_calls:
      - [ glob, { pattern: "docs/*setup*" } ]
  - tool_calls:
      - [ read_file, { path: docs/setup-guide.md } ]
  - tool_calls:
      - [ write_file, { path: out.txt, content: "Setup: run make.\n" } ]
  - text: Summary written.
expect:
  answer: Summary written.
  files:
    out.txt: "Setup: run make.\n"
  tools:
    - { name: read_file, error: true, text: 'Error: not a file: \S+docs/setup\.md' }
    - { name: glob, text: '\Adocs/setup-guide\.md\z' }
    - { name: read_file, text: 'Setup: run make' }
    - { name: write_file, text: '^Wrote 17 bytes to ' }
